name: Pipeline ríos, lluvia, viento y batimetría

# Se lanza a mano desde la pestaña Actions → "Run workflow".
# Requiere el secreto del repo CDS_KEY (token de ECMWF) y las licencias de
# ERA5 y GloFAS aceptadas en Copernicus. Los resultados se suben a la rama
# desde la que se lanza. Los scripts son reanudables: si un paso no termina
# (límite de 6 h por job), vuelve a lanzarlo y sigue donde quedó.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Año inicial"
        default: "2015"
      end:
        description: "Año final"
        default: "2025"
      pasos:
        description: "Pasos a correr (separados por espacio): rios viento lluvia ideam batimetria"
        default: "rios viento lluvia ideam batimetria"

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CDS_KEY: ${{ secrets.CDS_KEY }}
      CDS_URL: https://cds.climate.copernicus.eu/api
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Revisar token de Copernicus
        if: contains(inputs.pasos, 'rios') || contains(inputs.pasos, 'viento')
        run: |
          if [ -z "${CDS_KEY}" ]; then
            echo "::error::Falta el secreto CDS_KEY (Settings → Secrets and variables → Actions). Ríos y viento no se pueden descargar."
          else
            echo "CDS_KEY presente."
          fi

      - name: Ríos (GloFAS)
        if: contains(inputs.pasos, 'rios')
        continue-on-error: true
        working-directory: scripts
        run: python rivers_glofas.py --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Viento (ERA5)
        if: contains(inputs.pasos, 'viento')
        continue-on-error: true
        working-directory: scripts
        run: python wind_era5.py --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Lluvia (CHIRPS v3) — guarda tras cada año
        if: contains(inputs.pasos, 'lluvia')
        continue-on-error: true
        timeout-minutes: 300
        working-directory: scripts
        run: |
          for y in $(seq ${{ inputs.start }} ${{ inputs.end }}); do
            python rain_chirps_download.py --start $y --end $y; rc=$?
            bash ci_save.sh "CHIRPS v3 $y"
            if [ $rc -ne 0 ]; then echo "CHIRPS no responde; se retoma en la próxima ejecución."; exit 1; fi
          done

      - name: IDEAM (si hay CSV en data/ideam/raw)
        if: contains(inputs.pasos, 'ideam') && hashFiles('data/ideam/raw/*') != ''
        continue-on-error: true
        working-directory: scripts
        run: |
          python ideam_dhime.py
          if [ -d ../data/rivers/glofas_raw ]; then python rivers_glofas.py --process-only; fi

      - name: Análisis de lluvia
        if: contains(inputs.pasos, 'lluvia')
        continue-on-error: true
        working-directory: scripts
        run: python rain_analysis.py --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Batimetría (si hay GEBCO en data/bathymetry/raw)
        if: contains(inputs.pasos, 'batimetria') && hashFiles('data/bathymetry/raw/**/*.nc') != ''
        continue-on-error: true
        working-directory: scripts
        run: python bathymetry_gebco.py

      - name: Guardar resultados en la rama
        if: always()
        run: |
          bash scripts/ci_save.sh "Datos y figuras del pipeline (${{ inputs.start }}–${{ inputs.end }}: ${{ inputs.pasos }})"
